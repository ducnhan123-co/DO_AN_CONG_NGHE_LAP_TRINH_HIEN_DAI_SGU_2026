services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AI_PIPELINE_ENABLED: ${AI_PIPELINE_ENABLED:-false}
      MINERU_PREWARM: "false"
      MINERU_WORKERS: "0"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      - ./backend/data:/app/backend/data
      - model_cache:/root/.cache  # MinerU OCR/VLM cache, NOT E5/Qwen
    restart: unless-stopped
volumes:
  model_cache:
