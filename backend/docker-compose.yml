# Chạy từ thư mục backend/:  docker compose up -d --build
services:
  pdf2docx:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        PRELOAD_MODELS: "1"
        WITH_RAG: "0"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped