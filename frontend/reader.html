<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MatchPDF — PDF sang DOCX</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23EA580C'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>P</text></svg>" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['"Be Vietnam Pro"','Inter','system-ui','sans-serif'],mono:['"JetBrains Mono"','monospace']},colors:{brand:{50:'#FFF4ED',100:'#FFE6D5',500:'#EA580C',600:'#C2410C'}}}}}
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
  html,body{height:100%}
  body{background:#E7E5E4;color:#1C1917;-webkit-font-smoothing:antialiased}
  .pdf-page{background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 18px 44px -20px rgba(0,0,0,.28);transition:box-shadow .3s}
  .pdf-page.flash{box-shadow:0 0 0 3px #EA580C,0 18px 44px -20px rgba(234,88,12,.5)}
  .msg-in{animation:msgIn .35s cubic-bezier(.2,.8,.2,1) both}
  @keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  .typing span{width:7px;height:7px;border-radius:99px;background:#A8A29E;display:inline-block;animation:tp 1.1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
  .cite{display:inline-flex;align-items:center;gap:2px;margin:0 1px;padding:1px 7px;border-radius:99px;background:#FFF4ED;border:1px solid #FDBA74;color:#C2410C;font-size:11px;font-weight:700;font-family:"JetBrains Mono",monospace;cursor:pointer;vertical-align:2px;transition:all .15s;white-space:nowrap}
  .cite:hover{background:#EA580C;color:#fff;border-color:#EA580C}
  .chip{transition:all .15s}
  .chip:hover{border-color:#EA580C;color:#C2410C;background:#FFF7ED}
  .chip:active{transform:scale(.97)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#C9C5C1;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
  #pdfScroll{scroll-behavior:smooth}
  @media(min-width:1024px){#splitWrap.flipped{flex-direction:row-reverse}}
  mark{background:#FEF3C7;color:inherit;border-radius:3px;padding:0 2px}
  .toolbtn{display:flex;align-items:center;gap:4px;border-radius:9px;padding:6px 8px;font-size:13px;color:#57534E;transition:all .15s}
  .toolbtn:hover{background:#F5F5F4;color:#1C1917}
  #btnDocx.glow-once{animation:docxGlow 1.6s ease-out 1}
  @keyframes docxGlow{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}70%{box-shadow:0 0 0 14px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
  [data-ol].is-active,[data-ol].is-active:hover{background:#1C1917!important;color:#fff!important}
  [data-ol].is-active span{color:#fff!important}
  kbd{font-family:"JetBrains Mono",monospace;font-size:10px;background:#F5F5F4;border:1px solid #E7E5E4;border-bottom-width:2px;border-radius:6px;padding:1px 5px;color:#78716C}
  /* PDF.js viewer: nền sáng theo app, trang bo góc + bóng nhẹ */
  #viewerContainer{position:absolute;inset:0;overflow:auto;background:#E7E5E4}
  #viewerContainer .pdfViewer .page{border:0;margin:16px auto;border-radius:6px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08),0 18px 44px -20px rgba(0,0,0,.28)}
  .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:.4em 0}
  #viewerContainer ::selection{background:rgba(234,88,12,.3)}
</style>

<body class="h-[100dvh] flex flex-col overflow-hidden">

<!-- ===== TOP BAR ===== -->
<header class="z-40 flex h-[56px] shrink-0 items-center gap-2 border-b border-stone-200 bg-white px-3 sm:px-4">
  <a href="index.html" class="toolbtn font-semibold" title="Về thư viện"><i class="ph-bold ph-arrow-left text-base"></i><span class="hidden md:inline">Thư viện</span></a>
  <button onclick="location.href='index.html'" class="toolbtn font-bold" title="Phiên mới: về thư viện tải PDF khác"><i class="ph-bold ph-plus text-base"></i><span class="hidden md:inline">Mới</span></button>
  <span class="hidden sm:block h-5 w-px bg-stone-200"></span>
  <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-brand-500 text-white text-xs font-extrabold">PDF</span>
  <div class="min-w-0 flex-1 text-center">
    <h1 id="docTitle" class="truncate text-[13.5px] font-bold leading-tight">Chưa mở tài liệu</h1>
    <p id="docMeta" class="truncate font-mono text-[11px] text-stone-500">Về Thư viện tải PDF lên để chuyển sang DOCX</p>
  </div>
  <div class="ml-auto flex items-center gap-1">
    <span id="apiBadge" class="hidden md:flex items-center gap-1.5 rounded-full bg-stone-100 border border-stone-200 px-2.5 py-1 text-[11px] font-bold text-stone-500"><span class="h-1.5 w-1.5 rounded-full bg-stone-400"></span> Chế độ demo</span>
  </div>
</header>

<!-- ===== PDF ====== -->
<div id="splitWrap" class="flex min-h-0 flex-1">

  <!-- ===== LEFT: THƯ VIỆN (Tài liệu gần đây) ===== -->
  <aside id="libSide" class="hidden w-[248px] shrink-0 flex-col overflow-y-auto border-r border-stone-200 bg-white px-3 py-4 lg:flex">
    <p class="px-2 pb-1 pt-4 font-mono text-[10px] font-bold uppercase tracking-widest text-stone-400">Tài liệu gần đây</p>
    <div id="recentDocs" class="space-y-1"></div>
  </aside>

  <!-- ===== LEFT: PDF VIEWER ===== -->
  <section id="pdfPane" class="flex min-w-0 flex-1 flex-col">
    <div id="tabBar" class="hidden shrink-0 items-center gap-1 border-b border-stone-300/60 bg-white px-2 py-1.5">
      <button id="tabPrev" onclick="scrollTabs(-1)" class="grid h-7 w-7 shrink-0 place-items-center rounded-lg text-stone-400 hover:bg-stone-100 hover:text-stone-700" title="Cuộn sang trái"><i class="ph-bold ph-caret-left"></i></button>
      <div id="tabList" class="tab-scroll flex min-w-0 flex-1 items-center gap-1 overflow-x-auto"></div>
      <button id="tabNext" onclick="scrollTabs(1)" class="grid h-7 w-7 shrink-0 place-items-center rounded-lg text-stone-400 hover:bg-stone-100 hover:text-stone-700" title="Cuộn sang phải"><i class="ph-bold ph-caret-right"></i></button>
      <div id="tabActions" class="flex shrink-0 items-center gap-1 border-l border-stone-200 pl-2"></div>
    </div>
    <style>.tab-scroll{scrollbar-width:thin;scrollbar-color:#d6d3d1 transparent}.tab-scroll::-webkit-scrollbar{height:8px}.tab-scroll::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:99px}.tab-scroll::-webkit-scrollbar-track{background:transparent}</style>
    <!-- toolbar -->
    <div class="flex shrink-0 flex-wrap items-center gap-1 border-b border-stone-300/60 bg-[#F5F5F4] px-3 py-1.5 text-[13px]">
      <button id="btnThumbs" class="toolbtn" title="Ẩn/hiện mục lục"><i class="ph-bold ph-sidebar-simple text-base"></i></button>
      <span class="h-5 w-px bg-stone-300"></span>
      <button id="prevPage" class="toolbtn"><i class="ph-bold ph-caret-left"></i></button>
      <span class="flex items-center gap-1 font-mono text-xs">Trang <input id="pageInput" value="1" class="w-10 rounded-md border border-stone-300 bg-white px-1 py-0.5 text-center outline-none focus:border-brand-500" /> / <span id="pageTotal">–</span></span>
      <button id="nextPage" class="toolbtn"><i class="ph-bold ph-caret-right"></i></button>
      <span class="h-5 w-px bg-stone-300"></span>
      <button id="zoomOut" class="toolbtn"><i class="ph-bold ph-minus"></i></button>
      <span id="zoomLabel" class="w-12 text-center font-mono text-xs">100%</span>
      <button id="zoomIn" class="toolbtn"><i class="ph-bold ph-plus"></i></button>
      <button id="zoomFit" class="toolbtn hidden sm:flex" title="Vừa chiều rộng"><i class="ph-bold ph-arrows-in-simple"></i></button>
      <div id="toolActions" class="ml-auto flex items-center gap-1">
        <input id="realFile" type="file" accept="application/pdf" class="hidden" />
        <button id="btnPrev" onclick="toggleDocxPreview()" class="toolbtn font-bold text-stone-400 pointer-events-none opacity-40" title="Đang xử lý DOCX…"><i class="ph-bold ph-eye text-base"></i><span id="prevLbl" class="hidden xl:inline">Sửa DOCX</span></button>
        <a id="btnDocx" href="#" onclick="return false" class="toolbtn font-bold text-stone-400 pointer-events-none opacity-40" title="Đang xử lý DOCX…"><i class="ph-bold ph-file-doc text-base"></i><span id="docxLbl" class="hidden xl:inline">Tải DOCX</span></a>
        <button id="btnHist" style="display:none" onclick="openHistory()" class="toolbtn font-bold" title="Lịch sử DOCX &amp; hoạt động"><i class="ph-bold ph-clock-counter-clockwise text-base"></i><span id="histLbl" class="hidden xl:inline">Lịch sử</span></button>
        <input id="serverFile" type="file" accept="application/pdf" class="hidden" />
      </div>
    </div>

    <!-- banner khi chưa mở tài liệu -->
    <div id="demoBanner" class="flex shrink-0 flex-wrap items-center gap-2 border-b border-orange-200 bg-gradient-to-r from-orange-50 to-amber-50 px-3 py-2 text-[12.5px]">
      <i class="ph-duotone ph-warning-circle text-base text-brand-600"></i>
      <span><b>Chưa mở tài liệu</b> — mở PDF từ máy để đọc, hoặc tải lên server để chuyển sang DOCX.</span>
      <span class="ml-auto flex gap-1.5">
        <button id="demoRead" class="rounded-lg border border-stone-300 bg-white px-2.5 py-1 font-bold text-stone-700 hover:border-brand-500">📄 Mở PDF từ máy</button>
        <button id="demoChat" class="rounded-lg bg-brand-500 px-2.5 py-1 font-bold text-white hover:bg-brand-600">✨ Tải lên để chuyển DOCX</button>
      </span>
    </div>

    <div class="flex min-h-0 flex-1">
      <!-- outline -->
      <aside id="outline" class="hidden w-[210px] shrink-0 flex-col gap-0.5 overflow-y-auto border-r border-stone-300/60 bg-[#F5F5F4] p-2 text-[13px]">

      <!-- pages -->
      <div id="pdfScroll" class="min-w-0 flex-1 overflow-y-auto px-3 py-5 sm:px-8">
        <div id="pages" class="mx-auto flex max-w-[780px] flex-col gap-5"></div>
      </div>
      <div id="pdfWrap" class="relative hidden min-w-0 flex-1"><div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div></div>
    </div>
  </section>

  <!-- ===== RIGHT: XEM TRƯỚC DOCX (tự mở khi DOCX xong) ===== -->
  <section id="docxPane" class="hidden w-[50%] min-w-[380px] shrink-0 flex-col border-l border-stone-300 bg-white">
    <div class="flex shrink-0 items-center gap-2 border-b border-stone-200 px-3 py-2">
      <i class="ph-duotone ph-file-doc text-xl text-emerald-600"></i>
      <p id="docxPaneTitle" class="min-w-0 flex-1 truncate text-[13px] font-bold">Bản DOCX</p>

      <button onclick="downloadEdited()" title="Tải bản đang sửa trong khung này" class="rounded-lg bg-brand-500 px-2.5 py-1 text-xs font-bold text-white hover:bg-brand-600">Tải bản đã sửa</button>

    <div id="docxToolbar" class="shrink-0 border-b border-stone-200 bg-white"></div>
    <div id="docxView" class="min-h-0 flex-1 overflow-auto bg-stone-100"></div>

</div>

<!-- toast -->
<div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[80] -translate-x-1/2 translate-y-4 rounded-xl bg-stone-900 px-4 py-2.5 text-sm font-semibold text-white opacity-0 shadow-2xl transition-all"></div>
<div id="docMenu" class="hidden fixed z-[70] w-52 rounded-xl border border-stone-200 bg-white p-1 text-[13px] shadow-xl"></div>
<div id="docxPanel" class="hidden fixed z-[75] w-[min(360px,94vw)] rounded-xl border border-stone-200 bg-white p-2 text-[13px] shadow-2xl">
  <p class="px-2 pb-1 pt-1 font-mono text-[10px] font-bold uppercase tracking-widest text-stone-400">File DOCX</p>
  <div id="docxList" class="max-h-[50vh] space-y-0.5 overflow-y-auto"></div>
  <div class="mt-2 flex justify-end border-t border-stone-100 pt-2">
    <button id="docxAllBtn" onclick="downloadAllDocx()" class="rounded-lg bg-stone-900 px-3 py-1.5 text-xs font-bold text-white hover:bg-brand-600 disabled:opacity-30 disabled:hover:bg-stone-900">Tải toàn bộ</button>
  </div>
</div>
<dialog id="histDlg" class="w-[min(560px,92vw)] rounded-3xl p-0 shadow-2xl">
  <div class="p-5">
    <div class="flex items-center gap-2"><h3 class="text-base font-extrabold tracking-tight">Lịch sử xử lý tài liệu</h3>
      <button onclick="document.getElementById('histDlg').close()" class="ml-auto grid h-8 w-8 place-items-center rounded-full hover:bg-stone-100"><i class="ph-bold ph-x"></i></button></div>
    <div id="histBody" class="mt-3 max-h-[60vh] overflow-y-auto text-[13px]"></div>
  </div>
</dialog>

<script>
/* PDF THẬT bằng PDF.js + chuyển DOCX qua server */
const params=new URLSearchParams(location.search);
window.addEventListener('error',e=>{ try{ const m=String((e&&e.message)||'lỗi không rõ'); if(/pdfjsLib|pdf_viewer|katex/i.test(m)) toast('Không tải được thư viện đọc PDF (trình duyệt chặn CDN?) — tắt Shields/chặn quảng cáo rồi tải lại'); else toast('Lỗi trang: '+m.slice(0,150)); }catch(_){} });
window.addEventListener('unhandledrejection',e=>{ try{ toast('Lỗi mạng: '+String((e.reason&&e.reason.message)||e.reason||'không rõ').slice(0,150)); }catch(_){} });
if(params.get('name')){document.getElementById('docTitle').textContent=decodeURIComponent(params.get('name'));document.getElementById('docMeta').textContent='File chưa lên server — dùng nút bên dưới để tải lên và chuyển DOCX';}

const pagesEl=document.getElementById('pages');
function hideDemo(){ const b=document.getElementById('demoBanner'); if(b) b.classList.add('hidden'); }
function showDemo(){ const b=document.getElementById('demoBanner'); if(b) b.classList.remove('hidden'); }
document.getElementById('demoRead').onclick=()=>document.getElementById('realFile').click();
document.getElementById('demoChat').onclick=()=>document.getElementById('serverFile').click();
/* ---- PDF THẬT: PDF.js viewer có lớp chữ (bôi đen/copy được), nền sáng theo app ---- */
let pdfScale=1.15, pdfViewer=null;
document.getElementById('realFile').onchange=e=>{ if(e.target.files[0]) showPdf(e.target.files[0]); };
function initViewer(){
  const eventBus=new pdfjsViewer.EventBus(), linkService=new pdfjsViewer.PDFLinkService({eventBus});
  pdfViewer=new pdfjsViewer.PDFViewer({container:document.getElementById('viewerContainer'),viewer:document.getElementById('viewer'),eventBus,linkService});
  linkService.setViewer(pdfViewer); pdfViewer._link=linkService;
  eventBus.on('pagesinit',()=>{ pdfViewer.currentScaleValue='page-width'; if(START_PAGE>1) pdfViewer.currentPageNumber=Math.min(START_PAGE,pdfViewer.pagesCount); pdfInit=true; });
  eventBus.on('pagechanging',e=>{ setActivePage(e.pageNumber); if(typeof savePage==='function'&&typeof API!=='undefined'&&API.docId) savePage(API.docId,e.pageNumber); });
  eventBus.on('scalechanging',e=>{ document.getElementById('zoomLabel').textContent=Math.round(e.scale*100)+'%'; });
}
// src: File (mở từ máy) hoặc URL (PDF gốc trên server)
let pdfToken=0;
async function showPdf(src,headers){
  const isFile=src instanceof File, myPdf=++pdfToken;
  try{
    toast('Đang mở PDF…');
    const doc=await pdfjsLib.getDocument(isFile?{data:await src.arrayBuffer()}:{url:src,httpHeaders:headers||undefined}).promise;
    if(myPdf!==pdfToken){ try{ doc.destroy(); }catch(e){} return; } // đã mở tài liệu khác trong lúc chờ
    // pdf.js 3.11: setDocument lần 2 trên cùng viewer ném TypeError (AnnotationEditorUIManager.destroy) -> khung PDF trống.
    // Nên mỗi tài liệu dựng viewer mới và giải phóng tài liệu cũ.
    if(pdfViewer){ document.getElementById('viewer').innerHTML=''; pdfViewer=null; }
    initViewer();
    const old=window.curPdf; window.curPdf=doc; if(old){ try{ old.destroy(); }catch(e){} }
    pdfViewer.setDocument(doc); pdfViewer._link.setDocument(doc);
    hideDemo(); document.getElementById('pdfScroll').classList.add('hidden'); document.getElementById('pdfWrap').classList.remove('hidden');
    if(isFile){ document.getElementById('docTitle').textContent=src.name; document.getElementById('docMeta').textContent='File mở từ máy · chỉ đọc (muốn chuyển DOCX thì tải lên từ thư viện)'; DOCX={}; refreshDocxUI() }
    const n=doc.numPages; document.getElementById('pageTotal').textContent=n;
    olActive=null; document.getElementById('outlineList').innerHTML=Array.from({length:n},(_,i)=>`<button onclick="gotoPage(${i+1})" data-ol="${i+1}" class="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left hover:bg-stone-200"><span class="font-mono text-[11px] text-stone-400 w-6">${i+1}</span><span class="truncate text-stone-600">Trang ${i+1}</span></button>`).join('');
    setActivePage(1);
  }catch(e){ console.error(e); toast('Không mở được PDF: '+String(e&&e.message||e).slice(0,120)); document.getElementById('docMeta').textContent='Không hiển thị được PDF — thử tắt chặn quảng cáo / tải lại trang'; }
}



let olActive=null;
function setActivePage(n){ document.getElementById('pageInput').value=n; if(olActive) olActive.classList.remove('is-active'); olActive=document.querySelector('[data-ol="'+n+'"]'); if(olActive) olActive.classList.add('is-active'); }
function gotoPage(n){
  if(pdfViewer&&pdfViewer.pdfDocument){ pdfViewer.currentPageNumber=Math.min(Math.max(1,n),pdfViewer.pagesCount); return; }
  const el=document.getElementById('page-'+n); if(!el) return; el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1400); }
window.gotoPage=gotoPage;
document.getElementById('prevPage').onclick=()=>gotoPage(Math.max(1,+document.getElementById('pageInput').value-1));
document.getElementById('nextPage').onclick=()=>gotoPage(Math.min(+document.getElementById('pageTotal').textContent,+document.getElementById('pageInput').value+1));
document.getElementById('pageInput').onchange=e=>gotoPage(+e.target.value||1);
function setZoom(z){ if(pdfViewer&&pdfViewer.pdfDocument){ pdfViewer.currentScale=Math.min(4,Math.max(.3,pdfViewer.currentScale*z/pdfScale)); return; }
  pdfScale=Math.min(2.2,Math.max(.7,z)); document.getElementById('zoomLabel').textContent=Math.round(pdfScale/1.15*100)+'%'; pagesEl.style.zoom=pdfScale/1.15; }
document.getElementById('zoomIn').onclick=()=>setZoom(pdfScale+.15);
document.getElementById('zoomOut').onclick=()=>setZoom(pdfScale-.15);
document.getElementById('zoomFit').onclick=()=>{ if(pdfViewer&&pdfViewer.pdfDocument) pdfViewer.currentScaleValue='page-width'; else setZoom(1.15); };
document.getElementById('btnThumbs').onclick=()=>document.getElementById('outline').classList.toggle('md:flex');


/* ===== THƯ VIỆN TRÊN SERVER (SQLite, cùng cổng 8000): tài liệu gần đây, lịch sử DOCX ===== */
let RECENTS=[], libWarned=false;
const escH=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function libDown(){ if(!libWarned){ libWarned=true; toast('Chưa kết nối thư viện (cùng cổng 8000) — lịch sử không được lưu'); } }
async function loadRecents(){ const r=await LIB.get('/doc'); if(r.ok) RECENTS=r.data; renderRecents(); return r; }
function renderRecents(){ const box=document.getElementById('recentDocs'); if(!box) return; const cur=API.docId;
  box.innerHTML=RECENTS.length?RECENTS.map(d=>{ const on=d.doc_id===cur; return `<div class="flex items-center gap-0.5 rounded-lg ${on?'bg-stone-900 text-white':'hover:bg-stone-100'}">

    <button onclick="event.stopPropagation();toggleMenu('doc','${d.doc_id}',this)" class="shrink-0 rounded-md px-1.5 py-1 ${on?'text-stone-300 hover:text-white':'text-stone-400 hover:text-stone-700'}" title="Tùy chọn"><i class="ph-bold ph-dots-three"></i></button>

/* menu ⋯ dùng chung cho tài liệu và phiên */
let menu=null;
const MI='flex w-full items-center gap-2 rounded-lg px-2.5 py-1.5 text-left hover:bg-stone-100';
function toggleMenu(kind,id,btn){ const m=document.getElementById('docMenu'); if(!m) return;
  if(menu&&menu.kind===kind&&menu.id===id&&!m.classList.contains('hidden')){ closeMenu(); return; }
  menu={kind,id}; const r=btn.getBoundingClientRect();
  m.innerHTML=`<button onclick="renameItem()" class="${MI}">✏️ Đổi tên</button><button onclick="deleteItem()" class="${MI} text-red-600">🗑 Xóa tài liệu + PDF</button><button onclick="location.href='index.html'" class="${MI}">📤 Tải PDF mới</button>`;
  m.classList.remove('hidden'); m.style.left=Math.min(r.left,window.innerWidth-210)+'px'; m.style.top=(r.bottom+4)+'px'; }
function closeMenu(){ const m=document.getElementById('docMenu'); if(m) m.classList.add('hidden'); menu=null; }
document.addEventListener('click',e=>{ const m=document.getElementById('docMenu'); if(m&&menu&&!m.classList.contains('hidden')&&!m.contains(e.target)) closeMenu(); });
async function renameItem(){ const t=menu; closeMenu(); if(!t) return;
  const d=RECENTS.find(x=>x.doc_id===t.id); const n=prompt('Tên mới:',d?(d.display_name||d.name):''); if(!n||!n.trim()) return;
  const r=await LIB.patch('/doc/'+t.id,{display_name:n.trim().slice(0,120)}); if(!r.ok){ libDown(); return; }
  await loadRecents(); if(t.id===API.docId) document.getElementById('docTitle').textContent=n.trim(); }
async function deleteItem(){ const t=menu; closeMenu(); if(!t) return;
  if(!confirm('Xóa tài liệu này khỏi thư viện, kèm công thức và các bản DOCX?')) return;
  const r=await LIB.del('/doc/'+t.id); if(!r.ok){ libDown(); return; }
  toast(r.data&&r.data.pdf==='deleted'?'Đã xóa tài liệu và PDF':'Đã xóa khỏi thư viện — PDF trên server chưa xóa được (BE chưa hỗ trợ)');
  await loadRecents(); if(t.id===API.docId) setTimeout(()=>location.href='index.html',900); }

/* đồng bộ sang thư viện: bản chụp DOCX (trùng hash thì bỏ qua) + nạp công thức khi MinerU xong */
const synced=new Set();
function libSync(j, docId){ const id=docId||API.docId; if(!id) return;
  if(j.docx==='ready'){ const k='d'+id+j.parser; if(!synced.has(k)){ synced.add(k); LIB.post('/doc/'+id+'/docx/snapshot',{source:j.parser==='mineru'?'mineru':'fast'}); } }
  if(j.parser==='mineru'){ const k='i'+id; if(!synced.has(k)){ synced.add(k); LIB.post('/doc/'+id+'/ingest'); } } }

const KIND={register:'Thêm tài liệu',docx:'Tạo bản DOCX',ingest:'Nạp công thức'};
async function openHistory(){ const id=API.docId; if(!id){ toast('Mở một tài liệu trước'); return; }
  const dlg=document.getElementById('histDlg'), body=document.getElementById('histBody'); body.innerHTML='<p class="text-stone-500">Đang tải…</p>'; dlg.showModal();
  const [v,a]=await Promise.all([LIB.get('/doc/'+id+'/docx'),LIB.get('/doc/'+id+'/activity')]);
  if(!v.ok||!a.ok){ body.innerHTML='<p class="text-stone-500">Chưa kết nối thư viện (cùng cổng 8000).</p>'; return; }
  const fmt=t=>new Date(t*1000).toLocaleString('vi-VN'), kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
  body.innerHTML=`<p class="font-mono text-[10px] font-bold uppercase tracking-widest text-stone-400">Các bản DOCX</p>`

    +`<p class="mt-4 font-mono text-[10px] font-bold uppercase tracking-widest text-stone-400">Nhật ký hoạt động</p>`
    +(a.data.length?a.data.map(x=>`<div class="mt-1 flex gap-2 border-b border-stone-100 py-1.5"><span class="w-32 shrink-0 font-mono text-[11px] text-stone-400">${fmt(x.created_at)}</span><span><b>${escH(KIND[x.kind]||x.kind)}</b>${x.detail?' — '+escH(x.detail):''}</span></div>`).join(''):'<p class="mt-1 text-stone-500">Chưa có hoạt động.</p>'); }

/* DOCX xong thì tự tải (Word mở file vừa tải). Chỉ tự tải khi thấy building->ready hoặc file vừa upload (index.html đánh dấu); mở lại tài liệu cũ không tải lại. */
const AUTO=new Set(); try{ JSON.parse(sessionStorage.getItem('matchpdf_autodocx')||'[]').forEach(x=>AUTO.add(x)); }catch(e){}
function autoDone(id){ AUTO.delete(id); try{ sessionStorage.setItem('matchpdf_autodocx',JSON.stringify([...AUTO])); }catch(e){} }
let autoQ=Promise.resolve(); // tải lần lượt, tránh trình duyệt chặn nhiều download cùng lúc
/* DOCX bên phải = trình SỬA SuperDoc (AGPL-3.0; công thức OMML, bảng, ảnh giữ nguyên khi xuất lại). Đóng tay thì không tự mở lại cho đến khi đổi tài liệu. */
let SD=null;
function destroySd(){ try{ if(SD&&SD.destroy) SD.destroy(); }catch(e){} SD=null; const v=$('docxView'); if(v) v.innerHTML=''; const t=$('docxToolbar'); if(t) t.innerHTML=''; $('docxEdited').classList.add('hidden'); }
async function downloadEdited(){
  if(!SD){ toast('Chưa có bản DOCX đang mở'); return; }
  try{ const blob=await SD.export({triggerDownload:false});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=docxFile(API.docId).replace(/\.docx$/i,'')+'_da_sua.docx';
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); toast('Đã tải bản đã sửa');
  }catch(e){ toast('Không xuất được bản đã sửa: '+String(e&&e.message||e).slice(0,100)); }
}
let DOCX_SHOWN=null, DOCX_CLOSED=new Set(), prevTok=0;
function hideDocxPreview(byUser){
  if(byUser&&DOCX_SHOWN) DOCX_CLOSED.add(DOCX_SHOWN);
  DOCX_SHOWN=null; prevTok++; destroySd(); $('docxPane').classList.add('hidden'); $('docxPane').classList.remove('flex'); refitPdf(); refreshDocxUI();
}
function refitPdf(){ setTimeout(()=>{ if(pdfViewer&&pdfViewer.pdfDocument) pdfViewer.currentScaleValue='page-width'; },50); }
function toggleDocxPreview(){
  const id=API.docId; if(!id) return;
  if(DOCX_SHOWN===id){ hideDocxPreview(true); } else { DOCX_CLOSED.delete(id); previewDocx(id); }
  refreshDocxUI();
}
async function previewDocx(id){
  if(id!==API.docId) return;
  const d=DOCX[id]; if(!d||!d.url){ if(DOCX_SHOWN) hideDocxPreview(); return; }
  if(DOCX_SHOWN===id||DOCX_CLOSED.has(id)||!window.SuperDoc) return;
  const my=++prevTok;
  try{
    const r=await fetch(API.base+d.url); if(!r.ok) throw 0;
    const buf=await r.arrayBuffer(); if(my!==prevTok||id!==API.docId) return;
    destroySd(); DOCX_SHOWN=id; $('docxPaneTitle').textContent=docxFile(id);
    $('docxPane').classList.remove('hidden'); $('docxPane').classList.add('flex'); refitPdf();   // hiện khung trước để SuperDoc đo được kích thước
    const file=new File([buf],docxFile(id),{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    SD=new window.SuperDoc({selector:'#docxView',toolbar:'#docxToolbar',documentMode:'editing',
      documents:[{id:'doc-'+id,type:'docx',data:file}],
      onEditorUpdate:()=>$('docxEdited').classList.remove('hidden')});
    refreshDocxUI();
  }catch(e){ destroySd(); DOCX_SHOWN=null; toast('Chưa mở được trình sửa DOCX — bấm Tải DOCX để mở bằng Word'); }
}
function noteDocx(id,j){
  const prev=DOCX[id];
  DOCX[id]=(j&&j.docx==='ready'&&j.docx_url)?{status:'ready',url:j.docx_url}:{status:(j&&j.docx==='failed')?'failed':'building'};
  refreshDocxUI(); previewDocx(id);
  if(DOCX[id].status==='ready'&&((prev&&prev.status!=='ready')||AUTO.has(id))){
    autoDone(id); autoQ=autoQ.then(async()=>{ toast('DOCX xong: '+dispName(id)+' — đang tải…'); await downloadDocxId(id,true); await new Promise(r=>setTimeout(r,800)); });
  }
}
function refreshDocxUI(){
  const b=$('btnDocx'), lbl=$('docxLbl'); if(!b) return;
  const multi=TABS.length>1, ids=multi?TABS:[API.docId].filter(Boolean);
  const ready=ids.filter(id=>DOCX[id]&&DOCX[id].url).length, failed=ids.some(id=>DOCX[id]&&DOCX[id].status==='failed');
  const on=ready>0;
  b.classList.toggle('text-emerald-700',on); b.classList.toggle('text-stone-400',!on);
  b.classList.toggle('opacity-40',!on); b.classList.toggle('pointer-events-none',!on&&!multi);
  lbl.textContent=multi?'Tải DOCX ('+ready+'/'+ids.length+')':'Tải DOCX';
  b.title=multi?'Danh sách DOCX để tải':on?'Tải file DOCX (công thức Equation)':(failed?'Tạo DOCX thất bại':'Đang xử lý DOCX…');
  if(on&&!b.dataset.ready){ b.dataset.ready='1'; b.classList.add('glow-once'); b.addEventListener('animationend',()=>b.classList.remove('glow-once'),{once:true}); }
  if(!on) delete b.dataset.ready;
  const bp=$('btnPrev'), cur=API.docId&&DOCX[API.docId]&&DOCX[API.docId].url;
  if(bp){ bp.classList.toggle('text-emerald-700',!!cur); bp.classList.toggle('text-stone-400',!cur); bp.classList.toggle('opacity-40',!cur); bp.classList.toggle('pointer-events-none',!cur); bp.title=cur?(DOCX_SHOWN===API.docId?'Đóng khung sửa DOCX':'Sửa DOCX bên phải'):'Đang xử lý DOCX…'; }
  renderDocxPanel();
}
function renderDocxPanel(){
  const box=$('docxList'); if(!box||TABS.length<2) return;
  box.innerHTML=TABS.map(id=>{ const d=DOCX[id]||{status:'building'}, ok=!!d.url;
    const st=ok?'<span class="text-emerald-700">Sẵn sàng</span>':d.status==='failed'?'<span class="text-red-600">Tạo DOCX lỗi</span>':'<span class="text-stone-400">⏳ Đang xử lý…</span>';
    return `<div class="flex items-center gap-2 rounded-lg px-2 py-1.5 hover:bg-stone-50"><i class="ph-duotone ph-file-doc shrink-0 text-xl ${ok?'text-emerald-600':'text-stone-300'}"></i>
      <div class="min-w-0 flex-1"><p class="truncate font-semibold">${escH(docxFile(id))}</p><p class="font-mono text-[11px]">${st}</p></div>
      <button onclick="downloadDocxId('${id}')" ${ok?'':'disabled'} class="rounded-lg bg-brand-500 px-2.5 py-1 text-xs font-bold text-white hover:bg-brand-600 disabled:opacity-30 disabled:hover:bg-brand-500">Tải</button></div>`; }).join('');
  const n=TABS.filter(id=>DOCX[id]&&DOCX[id].url).length, all=$('docxAllBtn');
  if(all){ all.disabled=!n; all.textContent='Tải toàn bộ'+(n?' ('+n+')':''); }
}
function toggleDocxPanel(){
  const p=$('docxPanel'), b=$('btnDocx');
  if(!p.classList.contains('hidden')){ p.classList.add('hidden'); return; }
  const r=b.getBoundingClientRect(); renderDocxPanel(); p.classList.remove('hidden');
  p.style.left='auto'; p.style.right=Math.max(8,window.innerWidth-r.right)+'px'; p.style.top=(r.bottom+6)+'px';
}
document.addEventListener('click',e=>{ const p=$('docxPanel'); if(p&&!p.classList.contains('hidden')&&!p.contains(e.target)&&!$('btnDocx').contains(e.target)) p.classList.add('hidden'); });
$('btnDocx').onclick=e=>{ e.preventDefault(); if(TABS.length>1) toggleDocxPanel(); else downloadDocxId(API.docId); };
async function downloadDocxId(id,quiet){
  const d=DOCX[id]; if(!d||!d.url){ if(!quiet) toast('DOCX đang xử lý, xong nút sẽ sáng lên'); return false; }
  if(!quiet) toast('Đang tải '+docxFile(id)+'…');
  try{
    const r=await fetch(API.base+d.url); if(!r.ok) throw 0;
    const blob=await r.blob(), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=docxFile(id); document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); return true;
  }catch(err){ toast('Chưa tải được '+docxFile(id)); return false; }
}
/* "Tải toàn bộ" = lần lượt kích hoạt N lượt tải riêng (trình duyệt có thể hỏi cho phép tải nhiều file lần đầu) */
async function downloadAllDocx(){
  const ids=TABS.filter(id=>DOCX[id]&&DOCX[id].url);
  if(!ids.length){ toast('Chưa có DOCX nào sẵn sàng'); return; }
  toast('Đang tải '+ids.length+' file DOCX…');
  let ok=0; for(const id of ids){ if(await downloadDocxId(id,true)) ok++; await new Promise(r=>setTimeout(r,600)); }
  toast('Đã tải '+ok+'/'+ids.length+' file'+(ids.length<TABS.length?' · '+(TABS.length-ids.length)+' file chưa xong':''));
}

function setMultiMode(){
  const bar=$('tabBar'); bar.classList.remove('hidden'); bar.classList.add('flex');
  $('tabActions').append($('btnPrev'),$('btnDocx'),$('btnHist'));       // chuyển 2 nút từ toolbar lên thanh tab
  $('docxLbl').className='inline'; $('histLbl').className='inline'; $('prevLbl').className='inline';
  renderTabs(); refreshDocxUI();
}
function renderTabs(){
  if(TABS.length<2) return; const list=$('tabList'); if(!list) return;
  list.innerHTML=TABS.map(id=>{ const on=id===API.docId, name=dispName(id);
    return `<button onclick="selectTab('${id}')" title="${escH(name)}" data-tab="${id}" class="flex max-w-[230px] shrink-0 items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-[13px] transition ${on?'bg-stone-900 font-bold text-white':'bg-stone-100 font-semibold text-stone-600 hover:bg-stone-200'}"><i class="ph-duotone ph-file-pdf shrink-0"></i><span class="truncate">${escH(name)}</span></button>`; }).join('');
  const on=list.querySelector('[data-tab="'+API.docId+'"]'); if(on) on.scrollIntoView({block:'nearest',inline:'center'});
}
/* kéo chuột để trượt thanh tab qua lại */
(function(){ const l=document.getElementById('tabList'); if(!l||l.dataset.drag) return; l.dataset.drag='1';
  let down=false,sx=0,sl=0; l.addEventListener('pointerdown',e=>{down=true;sx=e.clientX;sl=l.scrollLeft;});
  window.addEventListener('pointerup',()=>down=false); l.addEventListener('pointermove',e=>{ if(down) l.scrollLeft=sl-(e.clientX-sx); });
})();
function selectTab(id){ openDoc(id); }
function openFromSidebar(id){ // đang ở nhóm nhiều file mà bấm tài liệu ngoài nhóm -> mở trang riêng, không phá nhóm hiện tại
  if(TABS.length>1&&!TABS.includes(id)){ location.href='reader.html?doc_id='+encodeURIComponent(id); return; }
  openDoc(id);
}
async function prepTabs(){ // đăng ký toàn bộ file trong nhóm + theo dõi trạng thái DOCX của từng file
  await recentsP;
  await Promise.all(TABS.map(async id=>{ try{
    const j=await fetchInfo(id);
    if(!RECENTS.find(d=>d.doc_id===id)) await LIB.put('/doc/'+id,{name:j.name,num_pages:j.num_pages,parser:j.parser});
    showParser(j,id);
  }catch(e){} }));
  await loadRecents(); renderTabs();
}
function showParser(j,id){
  id=id||API.docId; INFO[id]=j;
  if(id===API.docId){
    API.ready=j.status==='ready';
    const meta=document.getElementById('docMeta');
    if(j.status==='indexing') meta.textContent=j.num_pages+' trang · ⏳ đang xử lý ở nền — PDF đọc được ngay, DOCX tự tải khi xong';
    else if(j.status==='failed') meta.textContent='❌ '+(j.error||'Không đọc được nội dung PDF');
    else meta.textContent=j.num_pages+' trang · '+j.num_chunks+' chunks · '+(PARSER[j.parser]||j.parser||'')+(j.embed==='building'?' · 🔎 đang lập chỉ mục':j.embed==='failed'?' · chỉ tìm theo từ khóa (embedding lỗi)':'');
  }
  noteDocx(id,j); libSync(j,id);
  clearTimeout(pollers[id]);
  const pending=j.status==='indexing'||j.embed==='building'||j.parser==='mineru_running'||j.docx==='building';
  if(pending) pollers[id]=setTimeout(async()=>{ try{ const r=await fetch(API.base+'/api/doc/'+id); const n=await r.json();
    if(id===API.docId&&n.parser==='mineru'&&j.parser!=='mineru') toast('MinerU xong: công thức đã chuẩn'); showParser(n,id); }catch(e){ showParser(j,id); } },j.status==='indexing'?2000:5000);
}

async function openDoc(id, pre){
  if(!id||(id===API.docId&&API.fileUrl)||opening===id) return;
  opening=id; const my=++openToken, stale=()=>my!==openToken;
  document.getElementById('docTitle').textContent='Đang tải tài liệu…';
  try{
    await recentsP; if(stale()) return;
    const known=RECENTS.find(d=>d.doc_id===id);
    let j=pre||null;
    if(!j&&!known){ // chưa có trong thư viện (đường dẫn trực tiếp/dữ liệu cũ): phải hỏi BE
      if(!API.online) await apiHealth();
      if(!API.online){ toast('Server chưa chạy — bật server rồi thử lại'); document.getElementById('docTitle').textContent='Chưa mở tài liệu'; return; }
      j=await fetchInfo(id); if(stale()) return; }
    const put=await LIB.put('/doc/'+id,{name:(j&&j.name)||known.name,num_pages:(j&&j.num_pages)||known.num_pages,parser:j?j.parser:known.parser});
    if(stale()) return;
    if(put.status===410){ toast('Tài liệu này đã bị xóa khỏi thư viện'); document.getElementById('docTitle').textContent='Đã xóa'; setTimeout(()=>location.href='index.html',1400); return; }
    if(!put.ok){ libDown(); if(!j){ j=await fetchInfo(id); if(stale()) return; } }
    const viaLib=put.ok, pages=(j&&j.num_pages)||(known&&known.num_pages)||'–';
    if(DOCX_SHOWN!==id) hideDocxPreview();
    API.docId=id; API.ready=false; API.sess=null; API.history=[]; API.busy=false; API.sawIndexing=!j;
    if(TABS.length<2) TABS=[id]; START_PAGE=RESUME[id]||1; renderTabs();
    API.fileUrl=viaLib?LIB.fileUrl(id):API.base+j.file_url;
    try{ history.replaceState(null,'','reader.html?'+TABS.map(x=>'doc_id='+encodeURIComponent(x)).join('&')); }catch(e){}
    hideDemo();
    showPdf(API.fileUrl,viaLib?{'X-Client-Id':LIB.cid()}:null);
    document.getElementById('pageTotal').textContent=pages;
    document.getElementById('docTitle').textContent=(put.ok&&put.data.display_name)||(j&&j.name)||known.name;
    const meta=document.getElementById('docMeta');
    if(j) showParser(j,id);
    else{ meta.textContent=pages+' trang · ⏳ đang nạp chỉ mục từ server — PDF đọc được ngay';
      fetchInfo(id).then(n=>{ showParser(n,id); })
        .catch(()=>{ if(API.docId===id) meta.textContent='❌ Chưa lấy được trạng thái từ server (BE tắt hoặc đã mất dữ liệu tài liệu) — PDF vẫn đọc được'; }); }
    await loadRecents(); if(stale()) return;
  }catch(e){ if(!stale()){ document.getElementById('docTitle').textContent='Không mở được tài liệu'; document.getElementById('docMeta').textContent='Tài liệu không còn trên server — về Thư viện tải lại nhé'; toast('Không mở được tài liệu — thử lại nhé'); } }
  finally{ if(opening===id) opening=null; }
}

async function initFromQuery(){
  const ids=[...new Set(new URLSearchParams(location.search).getAll('doc_id'))].filter(x=>/^[A-Za-z0-9_-]{1,64}$/.test(x)).slice(0,10);
  apiHealth(); // không chờ: health của BE có thể chậm khi Ollama bận, còn PDF mở từ thư viện ngay
  if(!ids.length||API.docId) return;
  TABS=ids; if(ids.length>1){ setMultiMode(); prepTabs(); }
  openDoc(ids[0]);
}
