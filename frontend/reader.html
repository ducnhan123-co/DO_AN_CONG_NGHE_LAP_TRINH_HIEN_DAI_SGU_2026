<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF → Word</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314213d'/%3E%3Cpath d='M8 9h16M8 15h16M8 21h9' stroke='%23ffd84d' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" style="width:min(1360px, 100% - 32px); padding-top:24px">
  <div class="rtop">
    <div>
      <a class="back" href="index.html">← Thư viện</a>
      <h2 id="title">Đang tải…</h2>
    </div>
    <div class="actions">
      <select class="pick" id="pick" aria-label="Chuyển sang tài liệu khác"></select>
      <span id="topActions" class="actions"></span>
    </div>
  </div>
  <div id="notice"></div>
  <div class="reader">
    <div class="viewer" id="viewer"></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  const { api, esc, fmtBytes, fmtDur, fmtTime, isActive, badgeClass, stepsHTML, progressHTML, whatText, toast, BASE, LABEL } = App;
  const $ = (id) => document.getElementById(id);
  const docId = new URLSearchParams(location.search).get("doc_id");
  if (!docId || !/^[A-Za-z0-9_-]{1,64}$/.test(docId)) { location.replace("index.html"); return; }
  let doc = null, timer = null, viewerSet = false;

  const fmtGB = (g) => g && g >= 0.1 ? String(g.toFixed(1)).replace(".", ",") + " GB" : "";
  const pg = (s) => s.page_from + "–" + s.page_to;

  function li(state, title, time, sub) {
    return '<li class="' + state + '"><span class="mk"></span><span>' + esc(title) + '</span><span class="t num">' + esc(time || "") + "</span>" +
      (sub ? '<span class="sub">' + sub + "</span>" : "") + "</li>";
  }

  function timelineHTML(d) {
    if (d.cache_hit) return '<ul class="tl">' + li("done", "Dùng lại kết quả đã có", "", "File giống hệt (cùng sha256) đã được chuyển trước đó nên không cần chạy lại.") + "</ul>";
    const runs = d.stages || [];
    const parseRun = runs.filter((r) => r.stage === "parse").pop();
    const parts = (d.shards || []).slice().sort((a, b) => a.index - b.index);
    const now = Date.now() / 1000;
    let items = "";
    if (parseRun) {
      const st = parts.some((p) => p.status === "failed") ? "failed" :
        parts.some((p) => p.status === "running") ? "running" :
          parts.length && parts.every((p) => p.status === "done") ? "done" : parseRun.status;
      const wall = parseRun.duration_s != null ? fmtDur(parseRun.duration_s) :
        parseRun.started_at ? fmtDur(now - parseRun.started_at) : "";
      const sub = parts.map((part) => {
        const bits = ["Phần " + part.index + "/" + parts.length + " · trang " + pg(part),
          part.status === "running" ? "đang chạy ~" + Math.floor(part.progress || 0) + "%" :
            part.status === "done" ? "xong" : part.status === "failed" ? "lỗi" : "đang chờ"];
        if (part.elapsed_s != null) bits.push(fmtDur(part.elapsed_s));
        if (part.peak_ram_gb) bits.push("RAM đỉnh " + fmtGB(part.peak_ram_gb));
        if (part.error) bits.push(part.error);
        return esc(bits.join(" · "));
      }).join("<br>");
      items += li(st, "Dịch bằng MinerU", wall, sub || "Đang chuẩn bị chia PDF");
    } else items += li("planned", "Dịch bằng MinerU", "", "Đang chờ lập kế hoạch chia phần");
    const defs = [["merge", "Ghép các phần"], ["prepare", "Chuẩn hóa công thức"], ["build", "Dựng file Word"], ["validate", "Kiểm tra file Word"]];
    defs.forEach(([key, title]) => {
      if (key === "merge") return;
      const r = runs.filter((x) => x.stage === key).pop();
      let sub = "";
      const n = r && r.note;
      if (n && key === "merge" && n.seams) { const j = n.seams.filter((s) => s.joined_paragraph).length; sub = esc(n.parts + " phần, " + n.images + " ảnh" + (j ? ", nối " + j + " đoạn bị cắt ngang" : "")); }
      if (n && key === "validate" && n.equations_docx != null) {
        sub = esc(n.equations_docx + "/" + n.formulas_md + " công thức thành Equation · " + n.images + " ảnh · " + n.tables + " bảng");
        if (n.warning) sub += '<br><span style="color:var(--bad)">' + esc(n.warning) + "</span>";
      }
      if (n && n.message) sub = '<span style="color:var(--bad)">' + esc(n.message) + "</span>";
      items += li(r ? r.status : "planned", title, r && r.duration_s != null ? fmtDur(r.duration_s) : "", sub);
    });
    return '<ul class="tl">' + items + "</ul>";
  }

  function renderPanel(d) {
    const active = isActive(d.status);
    let h = '<div><h3>Tiến độ</h3><div class="bigpct num">' + (d.status === "done" ? "100" : Math.floor(d.progress)) + '<small>%</small></div>' +
      progressHTML(d) +
      '<span class="badge ' + badgeClass(d.status) + '">' + esc(LABEL[d.status] || d.status) + "</span> <span class=\"what\" style=\"color:var(--ink-2);font-size:14px\">" + esc(whatText(d)) + "</span></div>";
    if (active || d.status === "done") h += "<div>" + stepsHTML(d) + "</div>";
    if (d.status === "failed" && d.error) h += '<div class="errline"><b>' + esc(d.error.code) + "</b><br>" + esc(d.error.message) + "</div>";
    h += "<div><h3>Chi tiết từng bước</h3>" + timelineHTML(d) + "</div>";
    h += '<div><h3>Thông tin</h3><dl class="kv num"><dt>Số trang</dt><dd>' + d.num_pages + "</dd><dt>Dung lượng PDF</dt><dd>" + fmtBytes(d.size_bytes) +
      "</dd>" + (d.docx_size ? "<dt>Dung lượng Word</dt><dd>" + fmtBytes(d.docx_size) + "</dd>" : "") + "<dt>Chế độ MinerU</dt><dd>" + esc(d.tier || "–") +
      "</dd><dt>Bắt đầu</dt><dd>" + fmtTime(d.created_at) + "</dd><dt>" + (active ? "Đã chạy" : "Tổng thời gian") + "</dt><dd>" + fmtDur(d.elapsed_s) +
      '</dd><dt>Mã</dt><dd class="mono">' + esc(d.id) + "</dd></dl></div>";
    $("panel").innerHTML = h;
  }

  function renderTop(d) {
    $("title").textContent = d.name;
    document.title = d.name + " · PDF → Word";
    const a = [];
    if (d.status === "done") a.push('<a class="btn primary" href="' + BASE + "/documents/" + d.id + '/docx">Tải Word</a>');
    if (isActive(d.status)) a.push('<button class="btn" type="button" data-act="cancel">Hủy</button>');
    if (d.status === "failed" || d.status === "cancelled") a.push('<button class="btn" type="button" data-act="retry">Thử lại</button>');
    a.push('<button class="btn quiet" type="button" data-act="rename">Đổi tên</button>');
    $("topActions").innerHTML = a.join("");
  }

  function setViewer() {
    if (viewerSet) return;
    viewerSet = true;
    $("viewer").innerHTML = '<iframe title="PDF gốc" src="' + BASE + "/documents/" + encodeURIComponent(docId) + '/pdf#view=FitH"></iframe>';
  }

  async function load() {
    clearTimeout(timer);
    try {
      doc = await api("/documents/" + encodeURIComponent(docId));
      renderTop(doc);
      renderPanel(doc);
      setViewer();
      $("notice").innerHTML = "";
      if (isActive(doc.status)) timer = setTimeout(load, document.hidden ? 5000 : 1200);
    } catch (e) {
      if (e.status === 404) {
        $("title").textContent = "Không tìm thấy tài liệu";
        $("viewer").innerHTML = '<div class="nopdf">Tài liệu không tồn tại hoặc đã bị xóa.<br><a href="index.html">Về thư viện</a></div>';
        $("panel").innerHTML = "";
        return;
      }
      $("notice").innerHTML = '<div class="notice bad">' + esc(e.message) + "</div>";
      timer = setTimeout(load, 4000);
    }
  }

  async function loadPicker() {
    try {
      const r = await api("/documents?limit=200");
      $("pick").innerHTML = r.items.map((d) => '<option value="' + esc(d.id) + '"' + (d.id === docId ? " selected" : "") + ">" + esc(d.name) + "</option>").join("");
    } catch (e) { $("pick").hidden = true; }
  }

  $("pick").addEventListener("change", (e) => { location.href = "reader.html?doc_id=" + encodeURIComponent(e.target.value); });
  $("topActions").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-act]");
    if (!b || !doc) return;
    try {
      if (b.dataset.act === "cancel") await api("/documents/" + docId + "/cancel", { method: "POST" });
      else if (b.dataset.act === "retry") await api("/documents/" + docId + "/retry", { method: "POST" });
      else if (b.dataset.act === "rename") {
        const n = prompt("Tên hiển thị:", doc.name);
        if (n === null) return;
        await api("/documents/" + docId, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ display_name: n }) });
        loadPicker();
      }
    } catch (err) { toast(err.message, true); }
    load();
  });

  loadPicker();
  load();
})();
</script>
</body>
</html>
