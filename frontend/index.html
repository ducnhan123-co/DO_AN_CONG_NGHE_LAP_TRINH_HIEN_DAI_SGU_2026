<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF → Word</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314213d'/%3E%3Cpath d='M8 9h16M8 15h16M8 21h9' stroke='%23ffd84d' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="kicker">PDF → Word</p>
      <h1>Từ PDF toán sang Word, <em>công thức sửa được</em></h1>
      <p class="lede">Công thức được chuyển thành Equation thật của Word, không phải ảnh. Nhiều file được xếp hàng; mỗi file có thể được dịch bằng nhiều tiến trình MinerU.</p>
    </div>
    <div class="slots" id="slots" title="Số tài liệu và tiến trình MinerU đang chạy"></div>
  </header>

  <div id="notice"></div>

  <div class="colmode">
    <span class="lbl">Bố cục cột</span>
    <div class="tabs" id="colmodeTabs" role="group" aria-label="Bố cục cột của PDF nhiều cột"></div>
    <p class="hint" id="colmodeHint"></p>
  </div>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="application/pdf,.pdf" multiple>
    <div class="big">Kéo thả PDF vào đây</div>
    <div class="small">hoặc bấm để chọn · nhiều file cùng lúc · tối đa 100 MB mỗi file</div>
    <div class="bar" id="upbar"></div>
  </label>

  <div class="tools">
    <div class="tabs" id="tabs" role="group" aria-label="Lọc tài liệu"></div>
    <input class="search" type="search" id="q" placeholder="Tìm theo tên file" aria-label="Tìm theo tên file">
  </div>

  <section class="list" id="list" aria-live="polite"></section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  const { api, esc, fmtBytes, fmtDur, isActive, badgeClass, stepsHTML, progressHTML, whatText, toast, BASE, LABEL } = App;
  const $ = (id) => document.getElementById(id);
  const FILTERS = [["all", "Tất cả"], ["active", "Đang xử lý"], ["done", "Xong"], ["failed", "Lỗi / hủy"]];
  let docs = [], filter = "all", query = "", timer = null;

  // Bố cục cột cho PDF có 2–3 cột trên một trang. Lựa chọn áp dụng cho các file được tải lên SAU đó và được nhớ lại.
  const COLMODES = [
    ["keep", "Giữ cột như PDF", "Giữ nguyên bố cục 2 hoặc 3 cột như bản PDF (khổ giấy và ngắt cột theo PDF)."],
    ["single", "Chuyển thành 1 cột", "Dồn các cột thành trang thông thường, đọc đúng thứ tự: cột 1 → cột 2 → cột 3 rồi mới sang trang kế."]
  ];
  let colMode = "keep";
  try { const v = localStorage.getItem("colMode"); if (COLMODES.some((m) => m[0] === v)) colMode = v; } catch (e) {}
  function renderColMode() {
    $("colmodeTabs").innerHTML = COLMODES.map(([k, label]) =>
      '<button type="button" data-m="' + k + '" aria-pressed="' + (colMode === k) + '">' + label + "</button>").join("");
    $("colmodeHint").textContent = COLMODES.find((m) => m[0] === colMode)[2];
  }

  // tìm kiếm không phân biệt hoa/thường và dấu tiếng Việt: "dai so" khớp "Đại số"
  const fold = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().trim();

  const inFilter = (d, f) => f === "all" || (f === "active" && isActive(d.status)) || (f === "done" && d.status === "done") ||
    (f === "failed" && (d.status === "failed" || d.status === "cancelled"));

  function renderTabs() {
    $("tabs").innerHTML = FILTERS.map(([k, label]) =>
      '<button type="button" data-f="' + k + '" aria-pressed="' + (filter === k) + '">' + label +
      '<span class="n num">' + docs.filter((d) => inFilter(d, k)).length + "</span></button>").join("");
  }

  function rowHTML(d) {
    const active = isActive(d.status);
    const meta = [d.num_pages + " trang", fmtBytes(d.size_bytes)];
    const cr = d.column_result;
    if (d.column_mode === "single") {
      if (cr) meta.push(cr.source_columns > 1 ? "đã dồn " + cr.source_columns + " cột → 1 cột" : "1 cột (không dò thấy nhiều cột trong PDF)");
      else meta.push("chuyển thành 1 cột");
    } else if (cr && cr.output_columns > 1) meta.push("giữ " + cr.output_columns + " cột");
    if (d.shards && d.shards.length > 1) meta.push(d.shards.length + " phần MinerU");
    if (active) meta.push("đã chạy " + fmtDur(d.elapsed_s));
    else if (d.status === "done" && !d.cache_hit) meta.push("mất " + fmtDur(d.elapsed_s));
    const acts = [];
    if (d.status === "done") acts.push('<a class="btn primary" href="' + BASE + "/documents/" + d.id + '/docx">Tải Word</a>');
    acts.push('<a class="btn" href="reader.html?doc_id=' + d.id + '">Mở</a>');
    if (active) acts.push('<button class="btn" type="button" data-act="cancel" data-id="' + d.id + '">Hủy</button>');
    if (d.status === "failed" || d.status === "cancelled") acts.push('<button class="btn" type="button" data-act="retry" data-id="' + d.id + '">Thử lại</button>');
    acts.push('<button class="btn quiet" type="button" data-act="rename" data-id="' + d.id + '">Đổi tên</button>');
    acts.push('<button class="btn quiet danger" type="button" data-act="delete" data-id="' + d.id + '">Xóa</button>');
    return '<div class="row-head"><h2 class="name"><a href="reader.html?doc_id=' + d.id + '">' + esc(d.name) + "</a></h2>" +
      '<div class="meta num">' + meta.map((m) => "<span>" + esc(m) + "</span>").join("") + "</div></div>" +
      '<div class="state"><div><span class="badge ' + badgeClass(d.status) + '">' + esc(LABEL[d.status] || d.status) + "</span> " +
      '<span class="what">' + esc(whatText(d)) + "</span> " + (active ? '<span class="pct">' + Math.floor(d.progress) + "%</span>" : "") + "</div>" +
      '<div class="actions">' + acts.join("") + "</div></div>" +
      (active || d.status === "done" ? progressHTML(d) : "") +
      (active || d.status === "done" ? stepsHTML(d) : "") +
      (d.status === "failed" && d.error ? '<div class="errline"><b>' + esc(d.error.code) + "</b> · " + esc(d.error.message) + "</div>" : "");
  }

  function signature(d) {
    return JSON.stringify([d.status, d.name, Math.floor(d.progress), (d.shards || []).map((s) => [s.status, Math.floor(s.progress || 0), s.error]), d.error && d.error.code,
      d.docx_available, isActive(d.status) ? Math.floor(d.elapsed_s || 0) : 0, d.cache_hit]);
  }

  function render() {
    renderTabs();
    const q = fold(query);
    const list = docs.filter((d) => inFilter(d, filter) && (!q || fold(d.name).includes(q) || fold(d.filename).includes(q)));
    const box = $("list");
    if (!list.length) {
      box.innerHTML = '<div class="empty"><div class="big">' + (docs.length ? "Không có tài liệu khớp" : "Chưa có tài liệu nào") + "</div>" +
        (docs.length ? "Thử đổi bộ lọc hoặc từ khóa." : "Thả file PDF vào khung phía trên để bắt đầu.") + "</div>";
      return;
    }
    const empty = box.querySelector(".empty");
    if (empty) empty.remove();
    const existing = new Map(Array.from(box.querySelectorAll(".row")).map((e) => [e.dataset.id, e]));
    let prev = null;
    for (const d of list) {
      let el = existing.get(d.id);
      if (!el) { el = document.createElement("article"); el.className = "row"; el.dataset.id = d.id; }
      const sig = signature(d);
      if (el.dataset.sig !== sig) { el.innerHTML = rowHTML(d); el.dataset.sig = sig; }
      const ref = prev ? prev.nextSibling : box.firstChild;
      if (el !== ref) box.insertBefore(el, ref);
      prev = el;
      existing.delete(d.id);
    }
    existing.forEach((e) => e.remove());
  }

  async function refreshStats() {
    try {
      const s = await api("/system/stats");
      const run = s.running.length;
      let dots = "";
      for (let i = 0; i < s.main_slots; i++) dots += '<span class="dot' + (i < run ? " on" : "") + '"></span>';
      if (s.aux_mode !== "off") dots += '<span class="dot aux' + (run > s.main_slots ? " on" : "") + '" title="Slot phụ: chỉ dùng khi máy dư RAM và CPU"></span>';
      const miners = Number(s.mineru_processes) || 0;
      $("slots").innerHTML = '<span class="dots" aria-hidden="true">' + dots + "</span><span><b class=\"num\">" + run + "</b> tài liệu đang chạy · <b class=\"num\">" + miners + "</b> tiến trình MinerU" +
        (s.queued_tasks ? " · <b class=\"num\">" + s.queued_tasks + "</b> tài liệu đang chờ" : "") + "</span>";
      $("slots").title = s.last_decision || "Số tài liệu và tiến trình MinerU đang chạy";
    } catch (e) { $("slots").innerHTML = ""; }
    setTimeout(refreshStats, document.hidden ? 10000 : 3000);
  }

  async function checkHealth() {
    try {
      const h = await api("/health");
      const miss = [];
      if (h.engine_found === false) miss.push("thư mục dự án rag_toan (phải nằm NGANG backend/ và frontend/, có src/build_docx.py)");
      if (!h.pandoc) miss.push("Pandoc (chưa cài hoặc không có trong PATH)");
      if (!h.mineru_found) miss.push("mineru-kit (không tìm thấy lệnh “" + h.mineru_cmd + "”)");
      let html = "";
      if (miss.length) html += '<div class="notice bad"><b>Thiếu công cụ:</b> ' + esc(miss.join("; ")) + ". File upload sẽ báo lỗi cho tới khi cài xong.</div>";
    } catch (e) { /* refresh() sẽ báo mất kết nối */ }
  }

  function xhrUpload(fd) {
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", BASE + "/documents");
      xhr.setRequestHeader("X-Client-Id", App.clientId());
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) $("upbar").style.width = Math.round(100 * e.loaded / e.total) + "%"; };
      xhr.onload = () => { let data = null; try { data = JSON.parse(xhr.responseText); } catch (e) {} resolve({ status: xhr.status, data }); };
      xhr.onerror = () => resolve({ status: 0, data: null });
      xhr.send(fd);
    });
  }

  async function upload(fileList) {
    const all = Array.from(fileList);
    const pdfs = all.filter((f) => /\.pdf$/i.test(f.name));
    all.filter((f) => !/\.pdf$/i.test(f.name)).forEach((f) => toast(f.name + ": không phải file PDF", true));
    if (!pdfs.length) return;
    const fd = new FormData();
    pdfs.forEach((f) => fd.append("files", f, f.name));
    fd.append("column_mode", colMode);
    $("upbar").style.width = "2%";
    const { status, data } = await xhrUpload(fd);
    $("upbar").style.width = "0";
    if (status === 202 && data) {
      const hits = data.items.filter((i) => i.cache_hit).length;
      toast("Đã nhận " + data.items.length + " file" + (hits ? " (" + hits + " file đã có kết quả sẵn)" : ""));
      (data.rejected || []).forEach((r) => toast(r.filename + ": " + r.message, true));
      // Máy chủ phải trả đúng chế độ đã chọn; nếu không (backend cũ bỏ qua trường column_mode) thì báo ngay, đừng im lặng
      if (data.items.some((i) => i.column_mode !== colMode)) toast("Máy chủ KHÔNG áp dụng chế độ “" + (colMode === "single" ? "Chuyển thành 1 cột" : "Giữ cột như PDF") + "” (backend chưa cập nhật hoặc chưa khởi động lại). Kết quả sẽ theo chế độ cũ.", true);
    } else if (status === 0) toast("Không kết nối được máy chủ. Server đã chạy chưa?", true);
    else toast(data && data.error ? data.error.message : "Upload thất bại (" + status + ")", true);
    refresh();
  }

  async function act(kind, id) {
    const d = docs.find((x) => x.id === id);
    try {
      if (kind === "cancel") await api("/documents/" + id + "/cancel", { method: "POST" });
      else if (kind === "retry") await api("/documents/" + id + "/retry", { method: "POST" });
      else if (kind === "delete") {
        if (!confirm("Xóa “" + (d ? d.name : id) + "” và toàn bộ file kết quả?")) return;
        await api("/documents/" + id, { method: "DELETE" });
      } else if (kind === "rename") {
        const n = prompt("Tên hiển thị:", d ? d.name : "");
        if (n === null) return;
        await api("/documents/" + id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ display_name: n }) });
      }
    } catch (e) { toast(e.message, true); }
    refresh();
  }

  $("list").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (b) act(b.dataset.act, b.dataset.id);
  });
  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]");
    if (b) { filter = b.dataset.f; render(); }
  });
  $("q").addEventListener("input", (e) => { query = e.target.value; render(); });
  $("colmodeTabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-m]"); if (!b) return;
    colMode = b.dataset.m;
    try { localStorage.setItem("colMode", colMode); } catch (err) {}
    renderColMode();
  });
  renderColMode();
  $("file").addEventListener("change", (e) => { upload(e.target.files); e.target.value = ""; });
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => upload(e.dataTransfer.files));
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  renderTabs();
  checkHealth();
  refreshStats();
  refresh();
})();
</script>
</body>
</html>
