<style>
  html{scroll-behavior:smooth}
  body{background:#E9E2D6;color:#1C1917;-webkit-font-smoothing:antialiased}

  body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(250,250,249,.12),rgba(250,250,249,.28))}
  .card-hover{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
  .card-hover:hover{transform:translateY(-3px);box-shadow:0 18px 40px -18px rgba(28,25,23,.25);border-color:#FDBA74!important}
  .card-hover:active{transform:translateY(0) scale(.99)}
  .thumb-paper{background:linear-gradient(180deg,#fff 0%,#FFF7ED 100%);position:relative;overflow:hidden}
  .thumb-lines{background-image:repeating-linear-gradient(180deg,transparent 0 9px,#E7E5E4 9px 10px);opacity:.55}
  .skeleton{position:relative;overflow:hidden;background:#F5F5F4}
  .skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.9) 50%,transparent 80%);animation:shimmer 1.4s infinite}
  @keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .fade-up{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .nav-item:hover{background:#F5F5F4;color:#1C1917}
  .nav-item.active{background:#1C1917;color:#fff}
  #sidebar{transition:margin-left .28s cubic-bezier(.2,.8,.2,1)}
  body.side-collapsed #sidebar{margin-left:-248px}
  #sideToggle i{transition:transform .25s}
  body.side-collapsed #sideToggle i{transform:rotate(180deg)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#D6D3D1;border-radius:8px;border:2px solid #FAFAF9}
  #dropOverlay{transition:opacity .2s}
  dialog::backdrop{background:rgba(28,25,23,.5);backdrop-filter:blur(4px)}

<body class="min-h-[100dvh]">

<div id="dropOverlay" class="fixed inset-0 z-[90] hidden items-center justify-center bg-stone-950/60 backdrop-blur-sm">

<div class="flex min-h-[100dvh]">
  <!-- ============ SIDEBAR ============ -->

    <a href="index.html" class="flex items-center gap-2.5 px-2">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand-500 text-white text-lg font-extrabold shadow-[0_8px_20px_-8px_rgba(234,88,12,.7)]">P</span>
      <span class="font-extrabold text-[17px] tracking-tight">Match<span class="text-brand-500">PDF</span> <span class="ml-1 rounded-md bg-stone-100 px-1.5 py-0.5 text-[10px] font-bold text-stone-500 align-middle whitespace-nowrap">SGU DEMO</span></span>
    </a>
    <button onclick="openUpload()" class="mt-6 flex items-center justify-center gap-2 rounded-xl bg-stone-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-stone-700 active:translate-y-[1px]">
      <i class="ph-bold ph-plus"></i> Tài liệu mới
    </button>
  </aside>

  <!-- ============ MAIN ============ -->

    <!-- topbar -->

          </label>
          <div class="hidden sm:flex items-center rounded-xl border border-stone-200 bg-white p-1 text-sm">

let DOCS = [];
let filter='all', query='', view='grid';
const grid = document.getElementById('grid');

function thumbHTML(d, i){
  return `<div class="flex items-center justify-between border-b border-stone-100 px-4 py-3">
    <span class="rounded-lg px-2 py-1 text-[11px] font-extrabold text-white" style="background:${d.color}">PDF</span>
    <i class="ph-duotone ph-file-pdf text-xl text-stone-300"></i>
  </div>`;
}
/* ---- trạng thái xử lý + thời gian (server vẫn chạy nền dù đã thoát reader) ---- */
const fmtDur=s=>{ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return m?m+' phút '+String(r).padStart(2,'0')+' giây':r+' giây'; };
const chipHTML=d=>`<span data-chip="${d.id}">${chipInner(d)}</span>`;
function refreshChips(){ DOCS.forEach(d=>document.querySelectorAll('[data-chip="'+d.id+'"]').forEach(el=>el.innerHTML=chipInner(d))); } // không render lại cả lưới -> không chớp animation
function chipInner(d){
  const i=d.info; if(!i) return '';
  const t=i.elapsed_s==null?'':fmtDur(i.elapsed_s+(d.tick||0));
  if(i.status==='failed'&&i.docx==='ready') return '<span class="text-[11px] font-bold text-amber-700">DOCX sẵn sàng · Tra cứu lỗi</span>';
  if(i.status==='failed') return '<span class="text-[11px] font-bold text-red-600">Xử lý lỗi · '+esc(i.error||'Xem nhật ký')+'</span>';
  if(i.docx==='ready') return `<span class="inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2 py-0.5 text-[11px] font-bold text-emerald-700"><i class="ph-bold ph-check-circle"></i>Đã xong${t?' · '+t:''}</span>`;
  if(i.docx==='failed') return `<span class="inline-flex items-center gap-1 rounded-full bg-red-50 px-2 py-0.5 text-[11px] font-bold text-red-600" title="${esc(i.error||'')}"><i class="ph-bold ph-warning-circle"></i>Lỗi${t?' · '+t:''}</span>`;
  return `<span class="inline-flex items-center gap-1 rounded-full bg-amber-50 px-2 py-0.5 text-[11px] font-bold text-amber-700"><i class="ph-bold ph-spinner-gap animate-spin"></i>Đang xử lý${t?' · '+t:''}</span>`;
}
let infoT, tickT;
async function loadInfos(){
  clearTimeout(infoT); clearInterval(tickT);
  await Promise.all(DOCS.map(async d=>{ try{ const r=await fetch(API_BASE+'/api/doc/'+d.id); d.info=r.ok?await r.json():null; d.tick=0; }catch(e){} }));
  refreshChips();
  if(DOCS.some(d=>d.info&&d.info.docx==='building')){
    const t0=Date.now(); // đồng hồ chạy mỗi giây giữa 2 lần hỏi server (5s)
    tickT=setInterval(()=>{ DOCS.forEach(d=>{ if(d.info&&d.info.docx==='building') d.tick=Math.round((Date.now()-t0)/1000); }); refreshChips(); },1000);
    infoT=setTimeout(loadInfos,5000);
  }
}
function render(){
  const list = DOCS.filter(d =>
    d.title.toLowerCase().includes(query.toLowerCase()));
  document.getElementById('docCount').textContent = list.length;
  document.getElementById('empty').classList.toggle('hidden', list.length>0);
  grid.className = view==='grid'
    ? 'mt-5 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3'
    : 'mt-5 flex flex-col gap-3';
  grid.innerHTML = list.map((d,i)=> view==='grid' ? `
    <article class="card-hover fade-up overflow-hidden rounded-2xl border border-stone-200 bg-white/85 backdrop-blur-sm" style="animation-delay:${i*40}ms">
      <div class="p-4">
        <div class="flex items-start gap-2"><h3 class="min-w-0 flex-1 font-bold text-[14px] leading-snug" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(d.title)}</h3>
          <button onclick="event.stopPropagation();cardMenu('${d.id}',this)" class="shrink-0 rounded-md px-1.5 py-0.5 text-stone-400 hover:bg-stone-100 hover:text-stone-700" title="Tùy chọn"><i class="ph-bold ph-dots-three"></i></button></div>
        <div class="mt-2">${chipHTML(d)}</div>
        <div class="mt-3">
          <a href="reader.html?doc_id=${d.id}" class="flex items-center justify-center gap-1.5 rounded-xl bg-stone-900 px-3 py-2 text-[13px] font-bold text-white transition hover:bg-brand-600 active:translate-y-[1px]">
            <i class="ph-duotone ph-file-doc"></i> Mở
          </a>
        </div>
      </div>
    </article>` : `
    <article class="card-hover fade-up flex items-center gap-4 rounded-2xl border border-stone-200 bg-white/85 backdrop-blur-sm p-3" style="animation-delay:${i*30}ms">
      <div class="min-w-0 flex-1">
        <h3 class="truncate font-bold text-sm">${esc(d.title)}</h3>
        <div class="mt-1">${chipHTML(d)}</div>
      </div>
      <a href="reader.html?doc_id=${d.id}" class="shrink-0 rounded-xl bg-stone-900 px-4 py-2 text-[13px] font-bold text-white hover:bg-brand-600 transition">Mở</a>
      <button onclick="event.stopPropagation();cardMenu('${d.id}',this)" class="shrink-0 rounded-md px-1.5 py-1 text-stone-400 hover:bg-stone-100 hover:text-stone-700" title="Tùy chọn"><i class="ph-bold ph-dots-three"></i></button>
    </article>`).join('');
}
const onQ=v=>{query=v;render();};
document.getElementById('sideToggle').onclick=()=>document.body.classList.toggle('side-collapsed');
document.getElementById('search').oninput=e=>onQ(e.target.value);
document.getElementById('searchM').oninput=e=>onQ(e.target.value);
document.getElementById('viewGrid').onclick=()=>{view='grid';render();
  document.getElementById('viewGrid').className='rounded-lg bg-stone-900 px-2.5 py-1.5 text-white';
  document.getElementById('viewList').className='rounded-lg px-2.5 py-1.5 text-stone-500 hover:bg-stone-100';};
document.getElementById('viewList').onclick=()=>{view='list';render();
  document.getElementById('viewList').className='rounded-lg bg-stone-900 px-2.5 py-1.5 text-white';
  document.getElementById('viewGrid').className='rounded-lg px-2.5 py-1.5 text-stone-500 hover:bg-stone-100';};

//     if(autoOpen){ location.replace('reader.html?doc_id='+j.doc_id); return; } // 1 file: mở đúng file vừa tải, replace để nút lui sạch
//     act.innerHTML=`<a href="reader.html?doc_id=${j.doc_id}" class="shrink-0 rounded-lg bg-brand-500 px-3 py-1.5 text-xs font-bold text-white hover:bg-brand-600">Mở tài liệu →</a>`;

const API_BASE=(window.MATCHPDF_API_BASE||'http://127.0.0.1:8000').replace(/\/$/,'');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function serverOnline(){ try{ const r=await fetch(API_BASE+'/api/health'); return (await r.json()).ok; }catch(e){ return false; } }
const MAX_FILES=10, MAX_MB=50;
let staged=[];            // {key,file,status:'wait'|'up'|'done'|'err',docId,pages,msg}
let uploading=false;
const uploadedByKey={};   // key -> {docId,pages}: file đã tải rồi thì không POST lại
const fkey=f=>f.name+'|'+f.size+'|'+f.lastModified;
const kbText=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
 
function openUpload(){ document.getElementById('uploadDlg').showModal(); renderStaged(); }
function handleFiles(list){ addFiles(list); }
document.getElementById('fileInput').onchange=e=>{ addFiles(e.target.files); e.target.value=''; };
['dragover','dragenter'].forEach(ev=>document.getElementById('dropzone').addEventListener(ev,e=>{e.preventDefault();e.currentTarget.classList.add('border-brand-500','bg-brand-50/60');}));
document.getElementById('dropzone').addEventListener('dragleave',e=>{e.currentTarget.classList.remove('border-brand-500','bg-brand-50/60');});
document.getElementById('dropzone').addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('border-brand-500','bg-brand-50/60');addFiles(e.dataTransfer.files);});
let dragN=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dragN++;const o=document.getElementById('dropOverlay');o.classList.remove('hidden');o.classList.add('flex');});
window.addEventListener('dragleave',e=>{e.preventDefault();if(--dragN<=0){dragN=0;const o=document.getElementById('dropOverlay');o.classList.add('hidden');o.classList.remove('flex');}});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dragN=0;const o=document.getElementById('dropOverlay');o.classList.add('hidden');o.classList.remove('flex');if(e.target.closest&&e.target.closest('#uploadDlg'))return;if(e.dataTransfer.files.length){openUpload();addFiles(e.dataTransfer.files);}});
 
function addFiles(list){
  if(uploading) return;
  for(const f of [...list]){ // chụp ngay: input.value='' làm rỗng FileList gốc
    if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){ toast('Bỏ qua “'+f.name+'” (không phải PDF)'); continue; }
    if(f.size>MAX_MB*1048576){ toast('“'+f.name+'” lớn hơn '+MAX_MB+'MB'); continue; }
    if(staged.length>=MAX_FILES){ toast('Tối đa '+MAX_FILES+' file mỗi lần'); break; }
    const key=fkey(f); if(staged.some(s=>s.key===key)) continue;
    const old=uploadedByKey[key];
    staged.push({key,file:f,status:old?'done':'wait',docId:old&&old.docId,pages:old&&old.pages});
  }
  renderStaged();
}
function removeStaged(i){ if(uploading) return; staged.splice(i,1); renderStaged(); }
function clearStaged(){ if(uploading) return; staged=[]; renderStaged(); }
function renderStaged(){
  const box=document.getElementById('uploadList'), foot=document.getElementById('uploadFooter'), btn=document.getElementById('openBtn');
  box.innerHTML=staged.map((s,i)=>{
    const st=s.status==='up'?'<span class="font-bold text-brand-600">Đang tải lên…</span>'
      :s.status==='done'?`<span class="text-emerald-700">${s.pages?s.pages+' trang · ':''}đã tải lên</span>`
      :s.status==='err'?`<span class="font-bold text-red-600">Lỗi: ${esc((s.msg||'').slice(0,120))}</span>`
      :'Sẵn sàng · '+kbText(s.file.size);
    return `<div class="fade-up flex items-center gap-3 rounded-xl border border-stone-200 bg-white p-3 text-sm">
      <span class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-brand-500 text-xs font-extrabold text-white">PDF</span>
      <div class="min-w-0 flex-1"><p class="truncate font-bold">${esc(s.file.name)}</p><p class="font-mono text-[11px] text-stone-500">${st}</p></div>
      <button onclick="removeStaged(${i})" ${uploading?'disabled':''} title="Bỏ file này" class="grid h-8 w-8 shrink-0 place-items-center rounded-full text-stone-400 transition hover:bg-red-50 hover:text-red-600 disabled:opacity-30"><i class="ph-bold ph-x"></i></button>
    </div>`; }).join('');
  const n=staged.length;
  foot.classList.toggle('hidden',!n); foot.classList.toggle('flex',!!n);
  btn.disabled=!n||uploading;
  btn.innerHTML=uploading?'Đang tải lên…':('Mở tài liệu'+(n>1?' ('+n+' file)':'')+' →');
}
async function openStaged(){
  if(uploading||!staged.length) return;
  if(!(await serverOnline())){ toast('Server chưa chạy — bật server rồi bấm Mở tài liệu lại'); return; }
  uploading=true; renderStaged();
  // Submit sequentially so failures are attributed to the correct file.
  // The server still enforces its queue limit; excessive batches may return 429.
  for (const s of staged) {
    if(s.status==='done') continue;
    s.status='up'; s.msg=''; renderStaged();
    try{
      const fd=new FormData(); fd.append('f',s.file);
      const r=await fetch(API_BASE+'/api/upload',{method:'POST',body:fd});
      if(!r.ok) throw new Error(await r.text());
      const j=await r.json();
      s.docId=j.doc_id; s.pages=j.num_pages; s.status='done';
      uploadedByKey[s.key]={docId:j.doc_id,pages:j.num_pages};
      const saved=await LIB.put('/doc/'+j.doc_id,{name:j.name||s.file.name,num_pages:j.num_pages,parser:j.parser});
      if(!saved.ok) toast('Tải PDF thành công nhưng thư viện chưa lưu được, sẽ thử lại khi mở tài liệu');
    }catch(e){ s.status='err'; s.msg=String(e&&e.message||e); }
    renderStaged();
  }
  uploading=false; renderStaged();
  if(staged.some(s=>s.status!=='done')){ toast('Có file tải lỗi — bỏ file lỗi (✕) hoặc bấm Mở tài liệu để thử lại'); return; }
  const ids=[...new Set(staged.map(s=>s.docId))];
  try{ sessionStorage.setItem('matchpdf_autodocx',JSON.stringify(ids)); }catch(e){} // reader tự tải DOCX khi xong
  location.replace('reader.html?'+ids.map(id=>'doc_id='+encodeURIComponent(id)).join('&')); // replace: nút lui về thư viện sạch
}
/* ---- thư viện lưu trên server (SQLite, cùng cổng 8000) ---- */
const mapDocs=rows=>rows.map(d=>({id:d.doc_id,title:d.display_name||d.name}));
async function migrateLegacy(){ // một lần: đưa danh sách "tài liệu gần đây" cũ (localStorage) lên server nếu BE còn file
  try{ if(localStorage.getItem('matchpdf_migrated')) return;
    const old=JSON.parse(localStorage.getItem('matchpdf_recents2')||'[]');
    for(const d of old){ const info=await fetch(API_BASE+'/api/doc/'+d.doc_id).then(r=>r.ok?r.json():null).catch(()=>null);
      if(info) await LIB.put('/doc/'+d.doc_id,{name:info.name||d.name,num_pages:info.num_pages,parser:info.parser}); }
    localStorage.setItem('matchpdf_migrated','1'); }catch(e){}
}
async function loadDocs(){
  let r=await LIB.get('/doc');
  if(r.ok){ await migrateLegacy(); r=await LIB.get('/doc'); DOCS=mapDocs(r.data||[]); }
  else { try{ DOCS=JSON.parse(localStorage.getItem('matchpdf_recents2')||'[]').map(d=>({id:d.doc_id,title:d.name})); }catch(e){ DOCS=[]; }
    toast('Chưa kết nối thư viện (cùng cổng 8000) — đang hiện danh sách cũ trong trình duyệt'); }
  render(); loadInfos();
}
let menuId=null;
function cardMenu(id,btn){ const m=document.getElementById('cardMenu');
  if(menuId===id&&!m.classList.contains('hidden')){ m.classList.add('hidden'); menuId=null; return; }
  menuId=id; const r=btn.getBoundingClientRect(); m.classList.remove('hidden');
  m.style.left=Math.min(r.left,window.innerWidth-200)+'px'; m.style.top=(r.bottom+4)+'px'; }
document.addEventListener('click',e=>{ const m=document.getElementById('cardMenu'); if(m&&menuId&&!m.classList.contains('hidden')&&!m.contains(e.target)){ m.classList.add('hidden'); menuId=null; } });
async function renameDoc(){ const id=menuId; document.getElementById('cardMenu').classList.add('hidden'); menuId=null;
  const d=DOCS.find(x=>x.id===id); if(!d) return; const n=prompt('Tên mới:',d.title); if(!n||!n.trim()) return;
  const r=await LIB.patch('/doc/'+id,{display_name:n.trim().slice(0,120)}); if(!r.ok){ toast('Không đổi được tên (thư viện chưa kết nối)'); return; } loadDocs(); }
async function deleteDoc(){ const id=menuId; document.getElementById('cardMenu').classList.add('hidden'); menuId=null;
  const d=DOCS.find(x=>x.id===id); if(!d||!confirm('Xóa “'+d.title+'” khỏi thư viện, kèm công thức và các bản DOCX?')) return;
  const r=await LIB.del('/doc/'+id); if(!r.ok){ toast('Không xóa được (thư viện chưa kết nối)'); return; }
  toast(r.data&&r.data.pdf==='deleted'?'Đã xóa tài liệu và PDF':'Đã xóa khỏi thư viện — PDF trên server chưa xóa được (BE chưa hỗ trợ)'); loadDocs(); }
let toastT; function toast(msg){ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='fixed bottom-6 left-1/2 z-[95] -translate-x-1/2 rounded-xl bg-stone-900 px-4 py-2.5 text-sm font-semibold text-white shadow-2xl transition-opacity'; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>t.style.opacity=0,3200); }
render(); loadDocs();
</script>
